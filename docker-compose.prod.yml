# docker-compose.prod.yml
# Production deployment manifest.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file EXTENDS docker-compose.yml with:
#   - Resource limits on every service
#   - Prometheus + Grafana monitoring stack
#   - Redis and Postgres exporters for Prometheus
#   - Production-hardened environment overrides
#   - No volume-mounted source code (images are built artifacts)

services:

  # ── Override: remove dev volume mounts, add resource limits ───────────────
  backend:
    volumes: []     # no live code mount in production
    restart: always
    deploy:
      resources:
        limits:
          cpus:   "2"
          memory: "2g"
        reservations:
          memory: "512m"
    environment:
      APP_ENV:   production
      LOG_LEVEL: INFO
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval:     30s
      timeout:      10s
      retries:      3
      start_period: 15s

  celery-worker:
    volumes: []
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus:   "2"
          memory: "2g"

  celery-agent-worker:
    volumes: []
    restart: always
    deploy:
      resources:
        limits:
          cpus:   "1"
          memory: "1g"

  celery-beat:
    volumes: []
    restart: always

  frontend:
    # Build the PRODUCTION image, not the dev one. The base Dockerfile's
    # CMD is `npm run dev`; without this override the public site would
    # serve the development server.
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_WS_URL:   ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    volumes: []     # no dev volume mounts
    restart: always
    deploy:
      resources:
        limits:
          cpus:   "1"
          memory: "512m"

  db:
    restart: always
    deploy:
      resources:
        limits:
          memory: "2g"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=4MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  redis:
    restart: always
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    deploy:
      resources:
        limits:
          memory: "768m"

  # ── Monitoring stack ────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: "1g"

  grafana:
    image: grafana/grafana:10.4.0
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_DOMAIN:           "${GRAFANA_DOMAIN:-localhost}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: "512m"

  # ── Redis exporter (exposes Redis metrics to Prometheus) ───────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.59.0
    restart: always
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: "64m"

  # ── Postgres exporter ──────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://aureus:${POSTGRES_PASSWORD:-localdevpassword}@db:5432/aureus_dev?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "64m"

volumes:
  prometheus_data:
  grafana_data:
