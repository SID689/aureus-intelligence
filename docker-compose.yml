services:
  # ── PostgreSQL (unchanged from Phase 1) ──────────────────────
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: aureus
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: aureus_dev
    ports:
      - "5432:5432"
    volumes:
      - aureus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aureus -d aureus_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (Celery broker + rate-limit cache) ──────────────────
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: always
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app   # hot-reload in development

  # ── Celery worker: market-data + news ingestion ───────────────
  celery-worker:
    build:
      context: ./backend
    command: >
      celery -A app.workers.celery_app worker
      --queues market-data,news-ingestion
      --concurrency 4
      --loglevel INFO
    restart: always
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ── Celery worker: agent orchestration (isolated pool) ────────
  celery-agent-worker:
    build:
      context: ./backend
    command: >
      celery -A app.workers.celery_app worker
      --queues agent-orchestration
      --concurrency 2
      --loglevel INFO
    restart: always
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ── Celery Beat: periodic ingestion scheduler ─────────────────
  celery-beat:
    build:
      context: ./backend
    command: >
      celery -A app.workers.celery_app beat
      --loglevel INFO
    restart: always
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  aureus_pgdata: