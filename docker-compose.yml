services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: aureus
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: aureus_dev
    ports:
      - "5432:5432"
    volumes:
      - aureus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aureus -d aureus_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --timeout-keep-alive 120
    restart: always
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  celery-worker:
    build:
      context: ./backend
    command: >
      celery -A app.workers.celery_app worker
      --queues market-data,news-ingestion
      --concurrency 4
      --loglevel INFO
    restart: always
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  celery-agent-worker:
    build:
      context: ./backend
    command: >
      celery -A app.workers.celery_app worker
      --queues agent-orchestration
      --concurrency 2
      --loglevel INFO
    restart: always
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  celery-beat:
    build:
      context: ./backend
    command: >
      celery -A app.workers.celery_app beat
      --loglevel INFO
    restart: always
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Phase 4: Next.js 15 frontend
  frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Overridable, because these were previously hardcoded here and a
      # value set in this block BEATS frontend/.env.local: Next reads
      # process env before its own files. A demo behind a tunnel could
      # therefore rewrite .env.local all it liked and the browser would
      # still be told to open a socket to localhost:8000, which on a
      # phone is the phone. Unset, the defaults are what they always were.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  aureus_pgdata:
