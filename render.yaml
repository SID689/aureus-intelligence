# Render blueprint for the demo API.
#
# Deploys ONLY the FastAPI web service. The Celery worker, agent worker and
# beat scheduler are deliberately absent: between them they issue roughly
# 900,000 Redis commands a day, which exhausts a free serverless Redis tier
# in about thirteen hours, and Render has no free background worker type to
# put them on anyway.
#
# Nothing the demo shows needs them. The analysis the UI calls runs inline
# in this process, and the scanner output the leaderboard and catalyst
# timeline read is loaded once from scripts/export_showcase_data.sh. See
# docs/DEMO_DEPLOYMENT.md.
#
# Render dashboard -> New -> Blueprint -> this repository.

services:
  - type: web
    name: aureus-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The image's own CMD carries --reload and a hardcoded port, which is
    # right for local development and wrong here: Render assigns the port
    # and a reloader would double the memory of a 512 MB instance.
    dockerCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # The presentation environment. Both of these must be false on any
      # deployment that takes payments: together they let anyone who can
      # reach /demo provision a free Institutional account.
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_TIER
        value: institutional

      # No workers are running, so nothing would consume a scan queued by
      # beat. Leaving the scanner on would only spend provider quota.
      - key: SCANNER_ENABLED
        value: "false"

      # Longer than the local default. A demo would rather serve an
      # analysis from earlier in the talk than make a room wait for a
      # cold pipeline run.
      - key: DEMO_ANALYSIS_CACHE_SECONDS
        value: "21600"
      - key: DEMO_PRICE_CACHE_SECONDS
        value: "900"

      # Values Render cannot know. Fill these in when the blueprint asks.
      - key: DATABASE_URL          # Neon, the POOLED connection string
        sync: false
      - key: REDIS_URL             # Upstash, rediss://
        sync: false
      - key: SECRET_KEY            # openssl rand -base64 32
        sync: false
      - key: INTERNAL_API_SECRET   # must match the frontend's exactly
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # the Vercel URL, once it exists
        sync: false
      - key: SEC_EDGAR_USER_AGENT  # "Your Name you@example.com", or SEC 403s
        sync: false

      # Optional. Every one of these can stay empty: prices fall through
      # to Yahoo and theses fall back to deterministic prose.
      - key: POLYGON_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
